p:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">A longer view<\u002Fp>\n        <div>\n          <p style=\"margin:0 0 28px;max-width:62ch;font-size:16px;line-height:1.6;color:var(--color-neutral-800)\">The electric car is not a new idea — it is a repeatedly abandoned one. Understanding why it stalled before helps explain what has to hold this time.<\u002Fp>\n          <sc-raw-table class=\"table\" style=\"width:100%\">\n            <sc-raw-tbody>\n              <sc-raw-tr><sc-raw-td style=\"width:80px;font-weight:600\">1828<\u002Fsc-raw-td><sc-raw-td>First recorded attempts at an electric vehicle, when horses and buggies were still the main mode of transport.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1901<\u002Fsc-raw-td><sc-raw-td>Porsche develops the first hybrid electric vehicle.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1900s<\u002Fsc-raw-td><sc-raw-td>Cheap oil and affordable petrol cars like Ford's Model T push EVs out of memory.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1968<\u002Fsc-raw-td><sc-raw-td>Soaring gas prices bring back some interest.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1970s<\u002Fsc-raw-td><sc-raw-td>The first commercially available EVs arrive.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1997<\u002Fsc-raw-td><sc-raw-td>The Toyota Prius, the first mass-produced hybrid, starts the real transition.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2006<\u002Fsc-raw-td><sc-raw-td>Tesla Motors arrives and incites a revolution.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2025<\u002Fsc-raw-td><sc-raw-td>China accelerates battery swapping at national scale.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:56px 0 72px\">\n        <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">From the report<\u002Fp>\n        <div data-grid=\"pair\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px\">\n          <div style=\"filter:var(--img-filter);aspect-ratio:4/3;border:var(--hair)\"><image-slot id=\"ev-s1\" shape=\"rect\" fit=\"cover\" placeholder=\"Survey data spread\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"filter:var(--img-filter);aspect-ratio:4/3;border:var(--hair)\"><image-slot id=\"ev-s2\" shape=\"rect\" fit=\"cover\" placeholder=\"Charging levels diagram\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:32px clamp(16px,4vw,32px)\">\n        <a href=\"#/byd-redesign\" style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Next case study<\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:-0.02em\">BYD Website Re-design →<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isBYD }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n      <div style=\"padding:48px 0 0\"><a href=\"#/\" style=\"font-size:13px;font-weight:600\">← All work<\u002Fa><\u002Fdiv>\n      <div style=\"padding:32px 0 56px;border-bottom:var(--rule)\">\n        <p style=\"margin:0 0 20px;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Case study 03 — Heuristic audit &amp; redesign · 2026<\u002Fp>\n        <h1 style=\"margin:0 0 24px;font-size:clamp(40px,5.6vw,76px);line-height:1;letter-spacing:-0.035em;max-width:16ch\">BYD Website Re-design<\u002Fh1>\n        <p style=\"margin:0;max-width:60ch;font-size:19px;line-height:1.5\">Build Your Dreams is a bold name for a site that reads like a datasheet. An evaluation against user-centred design principles and Nielsen's heuristics, then a redesign.<\u002Fp>\n      <\u002Fdiv>\n      <div data-grid=\"quad\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:var(--rule)\">\n        <div style=\"padding:24px 24px 24px 0;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Role<\u002Fp><p style=\"margin:0;font-weight:600\">Audit, UX &amp; UI<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Frameworks<\u002Fp><p style=\"margin:0;font-weight:600\">UCD principles, Nielsen's 10 heuristics<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Tools<\u002Fp><p style=\"margin:0;font-weight:600\">Figma<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px 0 24px 24px\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Output<\u002Fp><p style=\"margin:0;font-weight:600\">Audit report, redesigned pages<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"filter:var(--img-filter);border:var(--rule);border-top:0;aspect-ratio:16/9\">\n        <image-slot id=\"byd-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"BYD redesign — hero visual\"><\u002Fimage-slot>\n      <\u002Fdiv>\n\n      <div style=\"padding:clamp(44px,6vw,72px) 0 0\">\n        <p style=\"margin:0 0 32px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">What's wrong<\u002Fp>\n        <div style=\"border-top:var(--rule)\">\n          <div data-grid=\"trio3\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.4fr);gap:24px;padding:24px 0;border-bottom:var(--hair)\"><span style=\"color:var(--color-neutral-600);font-size:13px\">01<\u002Fspan><p style=\"margin:0;font-weight:600\">Weak emotional first impression<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-neutral-800)\">The hero section is flat and informative, with no visual drama, contrast, or emotional hook to immediately catch attention.<\u002Fp><\u002Fdiv>\n          <div data-grid=\"trio3\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.4fr);gap:24px;padding:24px 0;border-bottom:var(--hair)\"><span style=\"color:var(--color-neutral-600);font-size:13px\">02<\u002Fspan><p style=\"margin:0;font-weight:600\">Feature-led, not story-led<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-neutral-800)\">The page emphasises specs and feature blocks over a unified story, making the experience feel fragmented rather than immersive.<\u002Fp><\u002Fdiv>\n          <div data-grid=\"trio3\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.4fr);gap:24px;padding:24px 0;border-bottom:var(--hair)\"><span style=\"color:var(--color-neutral-600);font-size:13px\">03<\u002Fspan><p style=\"margin:0;font-weight:600\">Inconsistent visual hierarchy<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-neutral-800)\">No strong focal point or clear prioritisation, so multiple elements compete for attention and clutter builds.<\u002Fp><\u002Fdiv>\n          <div data-grid=\"trio3\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.4fr);gap:24px;padding:24px 0;border-bottom:var(--hair)\"><span style=\"color:var(--color-neutral-600);font-size:13px\">04<\u002Fspan><p style=\"margin:0;font-weight:600\">Weak scroll flow and rhythm<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-neutral-800)\">Transitions between sections are abrupt, leaving the scroll linear and content-heavy rather than entertaining.<\u002Fp><\u002Fdiv>\n          <div data-grid=\"trio3\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.4fr);gap:24px;padding:24px 0;border-bottom:var(--hair)\"><span style=\"color:var(--color-neutral-600);font-size:13px\">05<\u002Fspan><p style=\"margin:0;font-weight:600\">Limited perceived premium and trust<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-neutral-800)\">The UI lacks refined detailing, immersive imagery and expressive typography — the things that carry craftsmanship and confidence.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">UCD evaluation<\u002Fp>\n        <sc-raw-table class=\"table\" style=\"width:100%\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:170px\">Principle<\u002Fsc-raw-th><sc-raw-th>What was evaluated<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">Usefulness<\u002Fsc-raw-td><sc-raw-td>Whether model info, specs and dealer access address real EV buyer needs<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">Effectiveness<\u002Fsc-raw-td><sc-raw-td>Ability to complete tasks like exploring models and contacting dealers<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">Learnability<\u002Fsc-raw-td><sc-raw-td>Ease for first-time users to understand navigation and structure<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">Accessibility<\u002Fsc-raw-td><sc-raw-td>Support for users with diverse abilities and constraints<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">Efficiency<\u002Fsc-raw-td><sc-raw-td>Speed and smoothness of completing tasks<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">Satisfaction<\u002Fsc-raw-td><sc-raw-td>Overall emotional and visual experience<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Nielsen's heuristics<\u002Fp>\n        <ul style=\"margin:0;padding:0;list-style:none;border-top:var(--hair)\">\n          <li style=\"padding:16px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Visibility of system status<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Page transitions, section loads and form interactions give minimal feedback, so the interface feels unresponsive at times.<\u002Fp><\u002Fli>\n          <li style=\"padding:16px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Match between system and the real world<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Familiar automotive terms, but presented in a technical, feature-heavy way.<\u002Fp><\u002Fli>\n          <li style=\"padding:16px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">User control and freedom<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Deep navigation paths make it hard to jump back to models or contact.<\u002Fp><\u002Fli>\n          <li style=\"padding:16px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Consistency and standards<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Fonts and colours are consistent, but spacing, card styles and CTA treatments vary across sections.<\u002Fp><\u002Fli>\n          <li style=\"padding:16px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Error prevention<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Forms don't guide users away from mistakes — no alert for numbers in a name field or letters in a contact number.<\u002Fp><\u002Fli>\n          <li style=\"padding:16px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Recognition rather than recall<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Users must remember where test drive, contact and model actions live after navigating away.<\u002Fp><\u002Fli>\n          <li style=\"padding:16px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Flexibility and efficiency of use<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">The site treats every user the same, offering no shortcuts or quick actions.<\u002Fp><\u002Fli>\n          <li style=\"padding:16px 0\"><p style=\"margin:0 0 4px;font-weight:600\">Aesthetic and minimalist design<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Clean, but content density is high and sections carry more than they need to.<\u002Fp><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div style=\"padding:56px 0 72px\">\n        <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">The redesign<\u002Fp>\n        <div style=\"display:grid;gap:2px\">\n          <div style=\"filter:var(--img-filter);aspect-ratio:16/9;border:var(--hair)\"><image-slot id=\"byd-s1\" shape=\"rect\" fit=\"cover\" placeholder=\"Redesigned hero\"><\u002Fimage-slot><\u002Fdiv>\n          <div data-grid=\"pair\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px\">\n            <div style=\"filter:var(--img-filter);aspect-ratio:4/3;border:var(--hair)\"><image-slot id=\"byd-s2\" shape=\"rect\" fit=\"cover\" placeholder=\"Model page\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"filter:var(--img-filter);aspect-ratio:4/3;border:var(--hair)\"><image-slot id=\"byd-s3\" shape=\"rect\" fit=\"cover\" placeholder=\"Before / after\"><\u002Fimage-slot><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:32px clamp(16px,4vw,32px)\">\n        <a href=\"#/hyundai\" style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Next case study<\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:-0.02em\">The Design Language of Hyundai →<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHyundai }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n      <div style=\"padding:48px 0 0\"><a href=\"#/\" style=\"font-size:13px;font-weight:600\">← All work<\u002Fa><\u002Fdiv>\n      <div style=\"padding:32px 0 56px;border-bottom:var(--rule)\">\n        <p style=\"margin:0 0 20px;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Case study 04 — Design study · 2025<\u002Fp>\n        <h1 style=\"margin:0 0 24px;font-size:clamp(40px,5.6vw,76px);line-height:1;letter-spacing:-0.035em;max-width:16ch\">The Design Language of Hyundai<\u002Fh1>\n        <p style=\"margin:0;max-width:60ch;font-size:19px;line-height:1.5\">How a company that started by assembling someone else's car built a visual philosophy of its own — and then rewrote it twice.<\u002Fp>\n      <\u002Fdiv>\n      <div data-grid=\"trio\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:var(--rule)\">\n        <div style=\"padding:24px 24px 24px 0;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Type<\u002Fp><p style=\"margin:0;font-weight:600\">Brand &amp; design language study<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Span<\u002Fp><p style=\"margin:0;font-weight:600\">1947 — 2022<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px 0 24px 24px\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Output<\u002Fp><p style=\"margin:0;font-weight:600\">Illustrated written study<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"filter:var(--img-filter);border:var(--rule);border-top:0;aspect-ratio:16/9\">\n        <image-slot id=\"hy-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"Hyundai study — hero visual\"><\u002Fimage-slot>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Design language<\u002Fp>\n        <p style=\"margin:0;max-width:52ch;font-size:24px;line-height:1.4;letter-spacing:-0.012em\">Automotive design language is a complete visual and conceptual strategy that defines how a company's cars look, and why they look that way across an entire lineup.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"padding:clamp(44px,6vw,72px) 0 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0 0 32px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">The genesis of a design legacy<\u002Fp>\n        <sc-raw-table class=\"table\" style=\"width:100%;margin-bottom:56px\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"width:90px;font-weight:600\">1947<\u002Fsc-raw-td><sc-raw-td>Hyundai Group founded by Chung Ju-yung in post-WWII South Korea.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1967<\u002Fsc-raw-td><sc-raw-td>Hyundai Motor Company established on 29 December.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1968<\u002Fsc-raw-td><sc-raw-td>The Cortina is assembled at the Ulsan plant — Hyundai's first vehicle, built with Ford.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1975<\u002Fsc-raw-td><sc-raw-td>The Pony launches: South Korea's first mass-produced, independently developed car, designed by Giorgetto Giugiaro.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1985<\u002Fsc-raw-td><sc-raw-td>The first-generation Sonata arrives; the Pony Excel reaches the United States in 1986.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1996<\u002Fsc-raw-td><sc-raw-td>Global product standardisation — Accent and Elantra establish a consistent lineup and improve fit, finish and ergonomics.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">1998<\u002Fsc-raw-td><sc-raw-td>Hyundai acquires 51% of a bankrupt Kia during the Asian financial crisis, forming the Hyundai Motor Group.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2008<\u002Fsc-raw-td><sc-raw-td>Genesis embodies the vision of an ideal premium sedan, winning several American awards the following year.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2009<\u002Fsc-raw-td><sc-raw-td>Fluidic Sculpture becomes the design philosophy; Fluidic Sculpture 2.0 follows in 2013.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2015<\u002Fsc-raw-td><sc-raw-td>Creta.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2017<\u002Fsc-raw-td><sc-raw-td>The i30 N enters production — Hyundai N's first high-performance car, inspired by motorsport.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2018<\u002Fsc-raw-td><sc-raw-td>Kona Electric: early EV adoption, a more dynamic road presence and functional digital interfaces.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2019<\u002Fsc-raw-td><sc-raw-td>Sensuous Sportiness — emotional value and desire, meeting energy, proportion and stance.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2021<\u002Fsc-raw-td><sc-raw-td>Ioniq 5 brings an EV design revolution and a triple award win in a single year.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600\">2022<\u002Fsc-raw-td><sc-raw-td>Ioniq 6 refines the curves; the N Vision 74 sets Hyundai N's sights beyond electric.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <div style=\"padding:80px 0\">\n        <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Fluidic Sculpture, 2009<\u002Fp>\n        <blockquote style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(30px,4.4vw,58px);line-height:1.08;letter-spacing:-0.03em;max-width:22ch;border-left:0;padding:0\">“Fluidic Sculpture is based on the idea that motion exists even when the car is stationary.”<\u002Fblockquote>\n      <\u002Fdiv>\n\n      <div style=\"padding:0 0 72px\">\n        <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">From the study<\u002Fp>\n        <div data-grid=\"trio\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px\">\n          <div style=\"filter:var(--img-filter);aspect-ratio:4/3;border:var(--hair)\"><image-slot id=\"hy-s1\" shape=\"rect\" fit=\"cover\" placeholder=\"Timeline spread\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"filter:var(--img-filter);aspect-ratio:4/3;border:var(--hair)\"><image-slot id=\"hy-s2\" shape=\"rect\" fit=\"cover\" placeholder=\"Fluidic Sculpture\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"filter:var(--img-filter);aspect-ratio:4/3;border:var(--hair)\"><image-slot id=\"hy-s3\" shape=\"rect\" fit=\"cover\" placeholder=\"Sensuous Sportiness\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:32px clamp(16px,4vw,32px)\">\n        <a href=\"#/ar-car-styler\" style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Next case study<\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:-0.02em\">Augmented Reality Experience for Car Modification →<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top:var(--rule);background:var(--color-bg)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:48px clamp(16px,4vw,32px)\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap\">\n        <div style=\"display:flex;align-items:center;gap:16px\">\n          <span style=\"position:relative;display:inline-block;width:40px;height:40px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 0 50%,var(--color-bg) 50% 100%);border:1px solid var(--ink)\">\n            <span style=\"position:absolute;left:50%;top:0;width:20px;height:20px;border-radius:50%;background:var(--ink);transform:translateX(-50%)\"><\u002Fspan>\n            <span style=\"position:absolute;left:50%;bottom:0;width:20px;height:20px;border-radius:50%;background:var(--color-bg);transform:translateX(-50%)\"><\u002Fspan>\n            <span style=\"position:absolute;left:50%;top:7px;width:6px;height:6px;border-radius:50%;background:var(--color-bg);transform:translateX(-50%)\"><\u002Fspan>\n            <span style=\"position:absolute;left:50%;bottom:7px;width:6px;height:6px;border-radius:50%;background:var(--ink);transform:translateX(-50%)\"><\u002Fspan>\n          <\u002Fspan>\n          <div>\n            <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:16px\">Ayaan Ahmad<\u002Fp>\n            <p style=\"margin:0;font-size:13px;color:var(--color-neutral-700)\">Nagpur, India · ayaanahmad1409@gmail.com<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:24px;font-size:13px;font-weight:600\">\n          <a href=\"https://www.linkedin.com/in/ayaan-ahmad-4b755a27b/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\u002Fa>\n          <a href=\"https://www.instagram.com/ayaan.zen_/\" target=\"_blank\" rel=\"noopener\">Instagram<\u002Fa>\n          <a href=\"https://www.youtube.com/@ASquare_Zen\" target=\"_blank\" rel=\"noopener\">YouTube<\u002Fa>\n          <a href=\"https://in.pinterest.com/Ayaanzen/\" target=\"_blank\" rel=\"noopener\">Pinterest<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1f3fd0&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#1f3fd0&quot;,&quot;#0e4f8f&quot;,&quot;#1d1d1d&quot;,&quot;#2f6b5e&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;grayscalePhotos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;showScrollMark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  state = { route: 'home' };\n\n  routeFromHash() {\n    const h = (window.location.hash || '').replace(/^#\\/?/, '');\n    if (h === 'ar-car-styler' || h === 'ev-charging' || h === 'byd-redesign' || h === 'hyundai') return h;\n    return 'home';\n  }\n\n  componentDidMount() {\n    this.setState({ route: this.routeFromHash() });\n\n    this._onHash = () => {\n      const next = this.routeFromHash();\n      const changed = next !== this.state.route;\n      this.setState({ route: next });\n      if (changed) window.scrollTo(0, 0);\n    };\n    window.addEventListener('hashchange', this._onHash);\n\n    this._onScroll = () => {\n      const el = document.getElementById('yin-scroll');\n      if (!el) return;\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      const p = max > 0 ? window.scrollY / max : 0;\n      el.style.transform = 'rotate(' + (p * 360).toFixed(1) + 'deg)';\n      el.style.opacity = window.scrollY > 120 ? '1' : '0';\n      el.style.transition = 'opacity .3s ease';\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n\n    this.applyTweaks();\n  }\n\n  componentDidUpdate() { this.applyTweaks(); }\n\n  applyTweaks() {\n    const r = document.documentElement.style;\n    const accent = this.props.accentColor || '#1f3fd0';\n    r.setProperty('--color-accent', accent);\n    r.setProperty('--color-accent-700', accent);\n    r.setProperty('--img-filter', this.props.grayscalePhotos === false ? 'none' : 'grayscale(1) contrast(1.06)');\n    const yin = document.getElementById('yin-scroll');\n    if (yin) yin.style.display = this.props.showScrollMark === false ? 'none' : 'block';\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this._onHash);\n    window.removeEventListener('scroll', this._onScroll);\n  }\n\n  renderVals() {\n    const r = this.state.route;\n    return {\n      isHome: r === 'home',\n      isAR: r === 'ar-car-styler',\n      isEV: r === 'ev-charging',\n      isBYD: r === 'byd-redesign',\n      isHyundai: r === 'hyundai',\n      onSubmit: (e) => {\n        e.preventDefault();\n        const f = e.target;\n        const name = f.name.value, email = f.email.value, message = f.message.value;\n        const body = encodeURIComponent(message + '\\n\\n— ' + name + ' (' + email + ')');\n        window.location.href = 'mailto:ayaanahmad1409@gmail.com?subject=' +\n          encodeURIComponent('Portfolio enquiry from ' + name) + '&body=' + body;\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
