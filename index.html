  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

(\"2730b5e2-ed78-45b4-8603-14ba47855a9e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"41721937-2579-4585-bcb3-60003fae50a7\"><\u002Fscript>\n  <script src=\"67334182-66bf-419a-b6a9-404d8859a13a\"><\u002Fscript>\n  \n  <style>\n    :root{\n      --color-accent:#1f3fd0;\n      --color-accent-500:#3a5be0;\n      --color-accent-600:#1a35b0;\n      --color-accent-700:#152a91;\n      --ink:#201e1d;\n      --poster:#0e0e0e;\n      --img-filter:grayscale(1) contrast(1.06);\n      --rule:2px solid #201e1d;\n      --hair:1px solid #c9c6c6;\n    }\n    html{scroll-behavior:smooth}\n    body{margin:0;-webkit-font-smoothing:antialiased}\n    a{color:var(--color-accent-700);text-decoration:none}\n    a:hover{color:var(--color-accent);text-decoration:underline}\n    a:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}\n    ::selection{background:#ccd5f7}\n    image-slot{--img-filter:none}\n\n    @media (max-width:900px){\n      [data-grid=\"pair\"],[data-grid=\"trio\"],[data-grid=\"rail\"],[data-grid=\"trio3\"]{grid-template-columns:minmax(0,1fr)!important;gap:20px!important}\n      [data-grid=\"quad\"]{grid-template-columns:repeat(2,minmax(0,1fr))!important;column-gap:24px!important}\n      [data-grid] > *{border-right:0!important;padding-left:0!important;padding-right:0!important}\n      table.table{font-size:14px}\n    }\n    @media (max-width:620px){\n      [data-grid=\"quad\"]{grid-template-columns:minmax(0,1fr)!important;gap:0!important}\n      [data-grid=\"photos\"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}\n      [data-grid=\"row\"]{grid-template-columns:minmax(0,1fr)!important;gap:4px!important}\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:var(--color-bg);color:var(--ink);font-family:var(--font-body);min-height:100vh\">\n\n  <header style=\"position:sticky;top:0;z-index:50;background:var(--color-bg);border-bottom:var(--rule)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:flex;align-items:center;justify-content:space-between;min-height:64px;padding-top:10px;padding-bottom:10px;gap:12px 24px;flex-wrap:wrap\">\n      <a href=\"#/\" style=\"display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none\">\n        <span style=\"position:relative;display:inline-block;width:18px;height:18px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 0 50%,var(--color-bg) 50% 100%);border:1px solid var(--ink)\">\n          <span style=\"position:absolute;left:50%;top:0;width:9px;height:9px;border-radius:50%;background:var(--ink);transform:translateX(-50%)\"><\u002Fspan>\n          <span style=\"position:absolute;left:50%;bottom:0;width:9px;height:9px;border-radius:50%;background:var(--color-bg);transform:translateX(-50%)\"><\u002Fspan>\n          <span style=\"position:absolute;left:50%;top:3px;width:3px;height:3px;border-radius:50%;background:var(--color-bg);transform:translateX(-50%)\"><\u002Fspan>\n          <span style=\"position:absolute;left:50%;bottom:3px;width:3px;height:3px;border-radius:50%;background:var(--ink);transform:translateX(-50%)\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.01em\">Ayaan Ahmad<\u002Fspan>\n      <\u002Fa>\n      <nav style=\"display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;font-size:13px;font-weight:600;letter-spacing:0.02em\">\n        <a href=\"#/\" style=\"color:var(--ink)\">Work<\u002Fa>\n        <a href=\"#about\" style=\"color:var(--ink)\">About<\u002Fa>\n        <a href=\"#beyond\" style=\"color:var(--ink)\">Beyond design<\u002Fa>\n        <a href=\"#contact\" style=\"color:var(--ink)\">Contact<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div id=\"yin-scroll\" style=\"position:fixed;right:22px;bottom:22px;z-index:60;width:34px;height:34px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 0 50%,var(--color-bg) 50% 100%);border:1px solid var(--ink);box-shadow:var(--shadow-sm)\">\n    <span style=\"position:absolute;left:50%;top:0;width:16px;height:16px;border-radius:50%;background:var(--ink);transform:translateX(-50%)\"><\u002Fspan>\n    <span style=\"position:absolute;left:50%;bottom:0;width:16px;height:16px;border-radius:50%;background:var(--color-bg);transform:translateX(-50%)\"><\u002Fspan>\n    <span style=\"position:absolute;left:50%;top:6px;width:5px;height:5px;border-radius:50%;background:var(--color-bg);transform:translateX(-50%)\"><\u002Fspan>\n    <span style=\"position:absolute;left:50%;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--ink);transform:translateX(-50%)\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n\n    <section style=\"border-bottom:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n        <div data-grid=\"pair\" style=\"padding:clamp(48px,8vw,96px) 0 56px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:end\">\n          <div>\n            <p style=\"margin:0 0 28px;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Communication Design (UI/UX) · Symbiosis Institute of Design, Nagpur<\u002Fp>\n            <h1 style=\"margin:0 0 24px;font-size:clamp(52px,7.4vw,104px);line-height:0.95;letter-spacing:-0.035em\">Designing for<br>the cars we<br>actually drive.<\u002Fh1>\n            <p style=\"margin:0;max-width:56ch;font-size:19px;line-height:1.5;text-wrap:pretty\">I'm Ayaan Ahmad — a design student who has spent every project he could get his hands on pointed at the automotive industry. Research, interface, and the details in between.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding-bottom:8px\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:16px\">\n              <span style=\"width:8px;height:8px;border-radius:50%;background:var(--color-accent)\"><\u002Fspan>\n              <span style=\"font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase\">Open to internships, 2026<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"filter:var(--img-filter);border:var(--rule);aspect-ratio:4/5\">\n              <image-slot id=\"ayaan-portrait\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop your portrait here\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n        <div data-grid=\"quad\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr))\">\n          <div style=\"padding:28px 24px 28px 0;border-right:var(--hair)\">\n            <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Based in<\u002Fp>\n            <p style=\"margin:0;font-size:17px;font-weight:600\">Nagpur, India<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:28px 24px;border-right:var(--hair)\">\n            <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Class of<\u002Fp>\n            <p style=\"margin:0;font-size:17px;font-weight:600\">2027, B.Des<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:28px 24px;border-right:var(--hair)\">\n            <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Currently<\u002Fp>\n            <p style=\"margin:0;font-size:17px;font-weight:600\">Visual Designer, IB Group<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:28px 0 28px 24px\">\n            <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Focus<\u002Fp>\n            <p style=\"margin:0;font-size:17px;font-weight:600\">Automotive UX &amp; visual design<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"work\" style=\"border-bottom:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n        <div style=\"padding:clamp(48px,7vw,72px) 0 40px;display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 0 50%,transparent 50% 100%);border:1px solid var(--ink)\"><\u002Fspan>\n            <h2 style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;font-family:var(--font-body)\">Selected work<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;color:var(--color-neutral-700)\">Four case studies · 2024 — 2026<\u002Fp>\n        <\u002Fdiv>\n\n        <div data-grid=\"pair\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:var(--rule)\">\n\n          <a href=\"#/ar-car-styler\" style=\"display:block;color:var(--ink);text-decoration:none;padding:32px 32px 40px 0;border-right:var(--hair);border-bottom:var(--hair)\">\n            <div style=\"filter:var(--img-filter);border:var(--hair);aspect-ratio:16/10;margin-bottom:24px\">\n              <image-slot id=\"work-ar\" shape=\"rect\" fit=\"cover\" placeholder=\"AR Car Styler — key screen\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">01 — Concept · AR · 2025<\u002Fp>\n            <h3 style=\"margin:0 0 10px;font-size:28px;letter-spacing:-0.02em\">Augmented Reality Experience for Car Modification<\u002Fh3>\n            <p style=\"margin:0 0 18px;font-size:15px;line-height:1.55;color:var(--color-neutral-800);text-wrap:pretty\">A phone-based AR app that lets owners place, scale and lock styling stickers onto their actual car before they ever commit to one.<\u002Fp>\n            <span style=\"font-size:13px;font-weight:600;color:var(--color-accent-700)\">View case study →<\u002Fspan>\n          <\u002Fa>\n\n          <a href=\"#/ev-charging\" style=\"display:block;color:var(--ink);text-decoration:none;padding:32px 0 40px 32px;border-bottom:var(--hair)\">\n            <div style=\"filter:var(--img-filter);border:var(--hair);aspect-ratio:16/10;margin-bottom:24px\">\n              <image-slot id=\"work-ev\" shape=\"rect\" fit=\"cover\" placeholder=\"EV research — key spread\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">02 — UX Research · 2025<\u002Fp>\n            <h3 style=\"margin:0 0 10px;font-size:28px;letter-spacing:-0.02em\">A UX Research Case Study on Electric Vehicles<\u002Fh3>\n            <p style=\"margin:0 0 18px;font-size:15px;line-height:1.55;color:var(--color-neutral-800);text-wrap:pretty\">Thirty-six EV owners, one recurring answer: the car is fine, the charging isn't. A study of where adoption actually stalls.<\u002Fp>\n            <span style=\"font-size:13px;font-weight:600;color:var(--color-accent-700)\">View case study →<\u002Fspan>\n          <\u002Fa>\n\n          <a href=\"#/byd-redesign\" style=\"display:block;color:var(--ink);text-decoration:none;padding:32px 32px 40px 0;border-right:var(--hair)\">\n            <div style=\"filter:var(--img-filter);border:var(--hair);aspect-ratio:16/10;margin-bottom:24px\">\n              <image-slot id=\"work-byd\" shape=\"rect\" fit=\"cover\" placeholder=\"BYD redesign — hero screen\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">03 — Audit &amp; redesign · 2026<\u002Fp>\n            <h3 style=\"margin:0 0 10px;font-size:28px;letter-spacing:-0.02em\">BYD Website Re-design<\u002Fh3>\n            <p style=\"margin:0 0 18px;font-size:15px;line-height:1.55;color:var(--color-neutral-800);text-wrap:pretty\">A heuristic audit of a premium EV brand's site that reads like a spec sheet — and a redesign that gives it a story.<\u002Fp>\n            <span style=\"font-size:13px;font-weight:600;color:var(--color-accent-700)\">View case study →<\u002Fspan>\n          <\u002Fa>\n\n          <a href=\"#/hyundai\" style=\"display:block;color:var(--ink);text-decoration:none;padding:32px 0 40px 32px\">\n            <div style=\"filter:var(--img-filter);border:var(--hair);aspect-ratio:16/10;margin-bottom:24px\">\n              <image-slot id=\"work-hyundai\" shape=\"rect\" fit=\"cover\" placeholder=\"Hyundai study — key spread\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">04 — Design study · 2025<\u002Fp>\n            <h3 style=\"margin:0 0 10px;font-size:28px;letter-spacing:-0.02em\">The Design Language of Hyundai<\u002Fh3>\n            <p style=\"margin:0 0 18px;font-size:15px;line-height:1.55;color:var(--color-neutral-800);text-wrap:pretty\">From an assembled Cortina in 1968 to the N Vision 74 — how one company built, discarded and rebuilt a visual philosophy.<\u002Fp>\n            <span style=\"font-size:13px;font-weight:600;color:var(--color-accent-700)\">View case study →<\u002Fspan>\n          <\u002Fa>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"about\" style=\"border-bottom:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n        <div style=\"padding:clamp(48px,7vw,72px) 0 24px;display:flex;align-items:center;gap:12px\">\n          <span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 0 50%,transparent 50% 100%);border:1px solid var(--ink)\"><\u002Fspan>\n          <h2 style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;font-family:var(--font-body)\">About<\u002Fh2>\n        <\u002Fdiv>\n        <div data-grid=\"pair\" style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px 64px;padding-bottom:72px\">\n          <div>\n            <p style=\"margin:0 0 32px;font-size:24px;line-height:1.4;letter-spacing:-0.01em;text-wrap:pretty\">I'm Ayaan Ahmad, a passionate Design student at SID Nagpur, with an ambitious interest in automobiles. I blend creativity, research, and empathy to design meaningful digital experiences. Highly observant and self-driven, I approach every project with focus, curiosity and discipline, trying to connect technology and user experience through thoughtful user-centered design.<\u002Fp>\n            <div style=\"border-top:var(--rule)\">\n              <div data-grid=\"row\" style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:var(--hair)\">\n                <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">2023 — 27<\u002Fp>\n                <div>\n                  <p style=\"margin:0 0 2px;font-weight:600\">B.Des Communication Design (UI/UX)<\u002Fp>\n                  <p style=\"margin:0;font-size:14px;color:var(--color-neutral-700)\">Symbiosis Institute of Design, Symbiosis International University, Nagpur<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div data-grid=\"row\" style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:var(--hair)\">\n                <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Aug 2025 —<\u002Fp>\n                <div>\n                  <p style=\"margin:0 0 2px;font-weight:600\">Freelance Visual Designer — IB Group, Rajnandgaon<\u002Fp>\n                  <p style=\"margin:0;font-size:14px;color:var(--color-neutral-700)\">Interfaces for internal and client-facing sites, A+ content and e-commerce listing images, product mockups, FOP/BOP designs for upcoming launches.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div data-grid=\"row\" style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:var(--hair)\">\n                <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Languages<\u002Fp>\n                <p style=\"margin:0;font-size:14px\">English (C2) · Hindi (C1) · Urdu (B1) · German (A2)<\u002Fp>\n              <\u002Fdiv>\n              <div data-grid=\"row\" style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:20px 0\">\n                <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Tools<\u002Fp>\n                <p style=\"margin:0;font-size:14px\">Figma · Illustrator · Photoshop · After Effects · Unity · Adobe Express · Canva · Pacdora · FontForge · Clipchamp<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 18px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Recognition<\u002Fp>\n            <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:0;border-top:var(--hair)\">\n              <li style=\"padding:14px 0;border-bottom:var(--hair);font-size:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px\"><span>Top 10 Finalist — TuteDude Online UI/UX Design Hackathon<\u002Fspan><span style=\"color:var(--color-neutral-600)\">2025<\u002Fspan><\u002Fli>\n              <li style=\"padding:14px 0;border-bottom:var(--hair);font-size:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px\"><span>Best Visual Branding — SID Shark Tank, leading a team of 10<\u002Fspan><span style=\"color:var(--color-neutral-600)\">2026<\u002Fspan><\u002Fli>\n              <li style=\"padding:14px 0;border-bottom:var(--hair);font-size:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px\"><span>Visual design featured by Porsche India in their Holi reel<\u002Fspan><span style=\"color:var(--color-neutral-600)\">2024<\u002Fspan><\u002Fli>\n              <li style=\"padding:14px 0;border-bottom:var(--hair);font-size:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px\"><span>Participant — Adobe Design Hackathon, InFED, IIM Nagpur<\u002Fspan><span style=\"color:var(--color-neutral-600)\">2024<\u002Fspan><\u002Fli>\n              <li style=\"padding:14px 0;border-bottom:var(--hair);font-size:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px\"><span>Adobe Graphic Designer Professional Certificate — Coursera<\u002Fspan><span style=\"color:var(--color-neutral-600)\">2025<\u002Fspan><\u002Fli>\n              <li style=\"padding:14px 0;border-bottom:var(--hair);font-size:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px\"><span>Google UX Design Professional Certificate — Coursera<\u002Fspan><span style=\"color:var(--color-neutral-600)\">2024<\u002Fspan><\u002Fli>\n              <li style=\"padding:14px 0;border-bottom:var(--hair);font-size:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px\"><span>Introduction to Augmented Reality / ARCore — Coursera<\u002Fspan><span style=\"color:var(--color-neutral-600)\">2024<\u002Fspan><\u002Fli>\n              <li style=\"padding:14px 0;font-size:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px\"><span>Summer School, Remote Sensing &amp; GIS — IIRS, ISRO<\u002Fspan><span style=\"color:var(--color-neutral-600)\">2021<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"beyond\" style=\"border-bottom:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n        <div style=\"padding:clamp(48px,7vw,72px) 0 40px;display:flex;align-items:center;gap:12px\">\n          <span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 0 50%,transparent 50% 100%);border:1px solid var(--ink)\"><\u002Fspan>\n          <h2 style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;font-family:var(--font-body)\">Beyond design<\u002Fh2>\n        <\u002Fdiv>\n\n        <div data-grid=\"trio\" style=\"border-top:var(--rule);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))\">\n          <div style=\"padding:32px 32px 32px 0;border-right:var(--hair);border-bottom:var(--hair)\">\n            <p style=\"margin:0 0 8px;font-size:44px;font-family:var(--font-heading);font-weight:800;letter-spacing:-0.03em;line-height:1\">8.7M+<\u002Fp>\n            <p style=\"margin:0 0 6px;font-weight:600\">Instagram views<\u002Fp>\n            <p style=\"margin:0;font-size:14px;color:var(--color-neutral-700)\">Over a million likes across content I write, shoot and cut myself.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:32px;border-right:var(--hair);border-bottom:var(--hair)\">\n            <p style=\"margin:0 0 8px;font-size:44px;font-family:var(--font-heading);font-weight:800;letter-spacing:-0.03em;line-height:1\">90K+<\u002Fp>\n            <p style=\"margin:0 0 6px;font-weight:600\">YouTube views<\u002Fp>\n            <p style=\"margin:0;font-size:14px;color:var(--color-neutral-700)\">Including educational pieces on teenage anger and a critical analysis of social media.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:32px 0 32px 32px;border-bottom:var(--hair)\">\n            <p style=\"margin:0 0 8px;font-size:44px;font-family:var(--font-heading);font-weight:800;letter-spacing:-0.03em;line-height:1\">5×<\u002Fp>\n            <p style=\"margin:0 0 6px;font-weight:600\">Duolingo Diamond winner<\u002Fp>\n            <p style=\"margin:0;font-size:14px;color:var(--color-neutral-700)\">German, every year since 2023. Currently A2 and climbing.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:32px 32px 32px 0;border-right:var(--hair);border-bottom:var(--hair)\">\n            <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Badminton<\u002Fp>\n            <p style=\"margin:0;font-size:15px;line-height:1.55\">Represented SID Nagpur at the Symbiosis Inter-Institute Tournament in Pune, 2023 through 2025 — semi-finalists in 2025.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:32px;border-right:var(--hair);border-bottom:var(--hair)\">\n            <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Short film<\u002Fp>\n            <p style=\"margin:0;font-size:15px;line-height:1.55\">Co-wrote and acted in a short film integrating design and storytelling, 2024.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:32px 0 32px 32px;border-bottom:var(--hair)\">\n            <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">On campus<\u002Fp>\n            <p style=\"margin:0;font-size:15px;line-height:1.55\">Mental Health Ambassador for Symbiosis International University. Class Representative for the 2023–27 batch and Student Representative on SID Nagpur's Quality Improvement Cell. Invited panelist at the Industry–Academia Conclave, 2025.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:56px 0 24px;display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n          <h3 style=\"margin:0;font-size:32px;letter-spacing:-0.025em\">Photography<\u002Fh3>\n          <a href=\"https://in.pinterest.com/Ayaanzen/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:600\">Full board on Pinterest →<\u002Fa>\n        <\u002Fdiv>\n        <div data-grid=\"photos\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding-bottom:24px\">\n          <div style=\"filter:var(--img-filter);aspect-ratio:3/4;border:var(--hair)\"><image-slot id=\"photo-1\" shape=\"rect\" fit=\"cover\" placeholder=\"Photograph 01\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"filter:var(--img-filter);aspect-ratio:3/4;border:var(--hair)\"><image-slot id=\"photo-2\" shape=\"rect\" fit=\"cover\" placeholder=\"Photograph 02\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"filter:var(--img-filter);aspect-ratio:3/4;border:var(--hair)\"><image-slot id=\"photo-3\" shape=\"rect\" fit=\"cover\" placeholder=\"Photograph 03\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"filter:var(--img-filter);aspect-ratio:3/4;border:var(--hair)\"><image-slot id=\"photo-4\" shape=\"rect\" fit=\"cover\" placeholder=\"Photograph 04\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--poster);color:#f3f2f2\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,9vw,96px) clamp(16px,4vw,32px)\">\n        <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#8f8c8c\">In his own words, from the resume<\u002Fp>\n        <p style=\"margin:0;font-size:clamp(36px,5.4vw,76px);line-height:1.02;letter-spacing:-0.035em;font-family:var(--font-heading);font-weight:800;max-width:20ch\">A hardcore car enthusiast since childhood.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"contact\" style=\"border-bottom:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n        <div style=\"padding:clamp(48px,7vw,72px) 0 40px;display:flex;align-items:center;gap:12px\">\n          <span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 0 50%,transparent 50% 100%);border:1px solid var(--ink)\"><\u002Fspan>\n          <h2 style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;font-family:var(--font-body)\">Contact<\u002Fh2>\n        <\u002Fdiv>\n        <div data-grid=\"pair\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px 64px;padding-bottom:80px;border-top:var(--rule);padding-top:40px\">\n          <div>\n            <h3 style=\"margin:0 0 28px;font-size:40px;letter-spacing:-0.03em;line-height:1.05\">Let's talk about cars,<br>or the work.<\u002Fh3>\n            <div style=\"display:grid;gap:0;border-top:var(--hair)\">\n              <a href=\"mailto:ayaanahmad1409@gmail.com\" style=\"padding:16px 0;border-bottom:var(--hair);display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Email<\u002Fspan><span style=\"font-weight:600\">ayaanahmad1409@gmail.com<\u002Fspan><\u002Fa>\n              <a href=\"tel:+919119706690\" style=\"padding:16px 0;border-bottom:var(--hair);display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Phone<\u002Fspan><span style=\"font-weight:600\">+91 91197 06690<\u002Fspan><\u002Fa>\n              <a href=\"https://www.linkedin.com/in/ayaan-ahmad-4b755a27b/\" target=\"_blank\" rel=\"noopener\" style=\"padding:16px 0;border-bottom:var(--hair);display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">LinkedIn<\u002Fspan><span style=\"font-weight:600\">ayaan-ahmad<\u002Fspan><\u002Fa>\n              <a href=\"https://www.instagram.com/ayaan.zen_/\" target=\"_blank\" rel=\"noopener\" style=\"padding:16px 0;border-bottom:var(--hair);display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Instagram<\u002Fspan><span style=\"font-weight:600\">@ayaan.zen_<\u002Fspan><\u002Fa>\n              <a href=\"https://www.youtube.com/@ASquare_Zen\" target=\"_blank\" rel=\"noopener\" style=\"padding:16px 0;border-bottom:var(--hair);display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">YouTube<\u002Fspan><span style=\"font-weight:600\">@ASquare_Zen<\u002Fspan><\u002Fa>\n              <a href=\"https://in.pinterest.com/Ayaanzen/\" target=\"_blank\" rel=\"noopener\" style=\"padding:16px 0;border-bottom:var(--hair);display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Pinterest<\u002Fspan><span style=\"font-weight:600\">Ayaanzen<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <a class=\"btn btn-secondary\" href=\"assets/Ayaan-Ahmad-Resume-2026.pdf\" download=\"\" style=\"margin-top:28px\">Download resume (PDF)<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:grid;gap:20px\">\n              <div class=\"field\">\n                <label for=\"cf-name\">Your name<\u002Flabel>\n                <input class=\"input\" id=\"cf-name\" name=\"name\" type=\"text\" placeholder=\"Who's writing?\" required=\"required\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label for=\"cf-email\">Email<\u002Flabel>\n                <input class=\"input\" id=\"cf-email\" name=\"email\" type=\"email\" placeholder=\"you@company.com\" required=\"required\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label for=\"cf-message\">Message<\u002Flabel>\n                <textarea class=\"input\" id=\"cf-message\" name=\"message\" rows=\"7\" placeholder=\"A role, a project, or a car worth arguing about.\" required=\"required\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <button class=\"btn btn-primary\" type=\"submit\">Send message<\u002Fbutton>\n              <p style=\"margin:0;font-size:12px;color:var(--color-neutral-700)\">This opens your mail client with the message pre-filled.<\u002Fp>\n            <\u002Fform>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAR }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n      <div style=\"padding:48px 0 0\"><a href=\"#/\" style=\"font-size:13px;font-weight:600\">← All work<\u002Fa><\u002Fdiv>\n      <div style=\"padding:32px 0 56px;border-bottom:var(--rule)\">\n        <p style=\"margin:0 0 20px;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Case study 01 — Concept · Augmented reality · October 2025<\u002Fp>\n        <h1 style=\"margin:0 0 24px;font-size:clamp(40px,5.6vw,76px);line-height:1;letter-spacing:-0.035em;max-width:16ch\">Augmented Reality Experience for Car Modification<\u002Fh1>\n        <p style=\"margin:0;max-width:60ch;font-size:19px;line-height:1.5\">A mobile AR application that lets car owners place, scale and lock styling stickers onto their own car through the phone camera — before a single decal is bought.<\u002Fp>\n      <\u002Fdiv>\n      <div data-grid=\"quad\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:var(--rule)\">\n        <div style=\"padding:24px 24px 24px 0;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Role<\u002Fp><p style=\"margin:0;font-weight:600\">Concept, research, UX &amp; UI<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Type<\u002Fp><p style=\"margin:0;font-weight:600\">Self-initiated<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Tools<\u002Fp><p style=\"margin:0;font-weight:600\">Figma, Unity, After Effects<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px 0 24px 24px\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Deliverables<\u002Fp><p style=\"margin:0;font-weight:600\">Figma prototype, compilation video<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"filter:var(--img-filter);border:var(--rule);border-top:0;aspect-ratio:16/9\">\n        <image-slot id=\"ar-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"AR Car Styler — hero visual\"><\u002Fimage-slot>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">The problem<\u002Fp>\n        <div>\n          <p style=\"margin:0 0 24px;font-size:26px;line-height:1.35;letter-spacing:-0.015em;max-width:38ch\">Car owners struggle to visualize how styling stickers will look on their vehicles before applying them. This often leads to uncertainty and unsatisfying design choices.<\u002Fp>\n          <p style=\"margin:0;max-width:62ch;font-size:16px;line-height:1.6;color:var(--color-neutral-800)\">Stickers and wraps are cheap relative to the rest of car modification, but they are permanent enough to regret. The decision is made from a catalogue photo of somebody else's car, in somebody else's light, at somebody else's angle.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Objective<\u002Fp>\n        <p style=\"margin:0;max-width:62ch;font-size:18px;line-height:1.6\">To design a mobile-based AR application that allows users to visualize and experiment with styling stickers on their cars in real time using their phone's camera.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Design features<\u002Fp>\n        <div data-grid=\"pair\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:var(--hair)\">\n          <div style=\"padding:20px 24px 20px 0;border-right:var(--hair);border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-size:12px;color:var(--color-neutral-600)\">01<\u002Fp><p style=\"margin:0;font-weight:600\">Overlay stickers directly on the actual car<\u002Fp><\u002Fdiv>\n          <div style=\"padding:20px 0 20px 24px;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-size:12px;color:var(--color-neutral-600)\">02<\u002Fp><p style=\"margin:0;font-weight:600\">Scale, rotate, position and lock<\u002Fp><\u002Fdiv>\n          <div style=\"padding:20px 24px 20px 0;border-right:var(--hair);border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-size:12px;color:var(--color-neutral-600)\">03<\u002Fp><p style=\"margin:0;font-weight:600\">Pre-designed car stickers gallery<\u002Fp><\u002Fdiv>\n          <div style=\"padding:20px 0 20px 24px;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-size:12px;color:var(--color-neutral-600)\">04<\u002Fp><p style=\"margin:0;font-weight:600\">Dimension display<\u002Fp><\u002Fdiv>\n          <div style=\"padding:20px 24px 20px 0;border-right:var(--hair);border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-size:12px;color:var(--color-neutral-600)\">05<\u002Fp><p style=\"margin:0;font-weight:600\">Flashlight for better visibility in low light<\u002Fp><\u002Fdiv>\n          <div style=\"padding:20px 0 20px 24px\"><p style=\"margin:0 0 4px;font-size:12px;color:var(--color-neutral-600)\">06<\u002Fp><p style=\"margin:0;font-weight:600\">Take a photo and save to gallery<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Process<\u002Fp>\n        <div>\n          <p style=\"margin:0 0 28px;max-width:62ch;font-size:16px;line-height:1.6;color:var(--color-neutral-800)\">I started by looking at how augmented reality is already used across the automotive industry — trends and use cases through 2025, drawing on Vection Technologies, Porsche Newsroom and vehicle AR driving research. Existing tools had the right ingredients (resizing, public galleries, real-time placement) but none of them were built for styling. Their limitations set the brief.<\u002Fp>\n          <ol style=\"margin:0;padding:0;list-style:none;counter-reset:step;border-top:var(--hair)\">\n            <li style=\"padding:14px 0;border-bottom:var(--hair);display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px\"><span style=\"color:var(--color-neutral-600);font-size:13px\">01<\u002Fspan><span>Online research — AR in the automotive industry<\u002Fspan><\u002Fli>\n            <li style=\"padding:14px 0;border-bottom:var(--hair);display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px\"><span style=\"color:var(--color-neutral-600);font-size:13px\">02<\u002Fspan><span>Inspiration gathering and moodboard<\u002Fspan><\u002Fli>\n            <li style=\"padding:14px 0;border-bottom:var(--hair);display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px\"><span style=\"color:var(--color-neutral-600);font-size:13px\">03<\u002Fspan><span>Understanding the user needs, and a user persona<\u002Fspan><\u002Fli>\n            <li style=\"padding:14px 0;border-bottom:var(--hair);display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px\"><span style=\"color:var(--color-neutral-600);font-size:13px\">04<\u002Fspan><span>Mind mapping the feature set<\u002Fspan><\u002Fli>\n            <li style=\"padding:14px 0;border-bottom:var(--hair);display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px\"><span style=\"color:var(--color-neutral-600);font-size:13px\">05<\u002Fspan><span>User flow for the screens<\u002Fspan><\u002Fli>\n            <li style=\"padding:14px 0;border-bottom:var(--hair);display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px\"><span style=\"color:var(--color-neutral-600);font-size:13px\">06<\u002Fspan><span>Wireframes<\u002Fspan><\u002Fli>\n            <li style=\"padding:14px 0;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px\"><span style=\"color:var(--color-neutral-600);font-size:13px\">07<\u002Fspan><span>High-fidelity UI and an interactive Figma prototype<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:56px 0 72px\">\n        <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Screens<\u002Fp>\n        <div data-grid=\"trio\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px\">\n          <div style=\"filter:var(--img-filter);aspect-ratio:9/16;border:var(--hair)\"><image-slot id=\"ar-s1\" shape=\"rect\" fit=\"cover\" placeholder=\"Wireframe or screen 01\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"filter:var(--img-filter);aspect-ratio:9/16;border:var(--hair)\"><image-slot id=\"ar-s2\" shape=\"rect\" fit=\"cover\" placeholder=\"Screen 02\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"filter:var(--img-filter);aspect-ratio:9/16;border:var(--hair)\"><image-slot id=\"ar-s3\" shape=\"rect\" fit=\"cover\" placeholder=\"Screen 03\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:var(--rule)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:32px clamp(16px,4vw,32px)\">\n        <a href=\"#/ev-charging\" style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;color:var(--ink)\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Next case study<\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:-0.02em\">A UX Research Case Study on Electric Vehicles →<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isEV }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)\">\n      <div style=\"padding:48px 0 0\"><a href=\"#/\" style=\"font-size:13px;font-weight:600\">← All work<\u002Fa><\u002Fdiv>\n      <div style=\"padding:32px 0 56px;border-bottom:var(--rule)\">\n        <p style=\"margin:0 0 20px;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Case study 02 — UX research · 2025<\u002Fp>\n        <h1 style=\"margin:0 0 24px;font-size:clamp(40px,5.6vw,76px);line-height:1;letter-spacing:-0.035em;max-width:16ch\">A UX Research Case Study on Electric Vehicles<\u002Fh1>\n        <p style=\"margin:0;max-width:60ch;font-size:19px;line-height:1.5\">Thirty-six EV owners answered a survey about their cars. Almost none of the complaints were about the car.<\u002Fp>\n      <\u002Fdiv>\n      <div data-grid=\"quad\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:var(--rule)\">\n        <div style=\"padding:24px 24px 24px 0;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Role<\u002Fp><p style=\"margin:0;font-weight:600\">Primary &amp; secondary research<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Method<\u002Fp><p style=\"margin:0;font-weight:600\">Survey, 36 responses<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px;border-right:var(--hair)\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Scope<\u002Fp><p style=\"margin:0;font-weight:600\">Charging infrastructure &amp; ownership<\u002Fp><\u002Fdiv>\n        <div style=\"padding:24px 0 24px 24px\"><p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Output<\u002Fp><p style=\"margin:0;font-weight:600\">Research report<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"filter:var(--img-filter);border:var(--rule);border-top:0;aspect-ratio:16/9\">\n        <image-slot id=\"ev-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"EV research — hero visual\"><\u002Fimage-slot>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Problem statement<\u002Fp>\n        <p style=\"margin:0;max-width:52ch;font-size:24px;line-height:1.4;letter-spacing:-0.012em\">Even as electric vehicles become more affordable and desirable, their adoption is still constrained by unreliable, inaccessible, and slow charging infrastructure. Unlike traditional petrol/diesel vehicles, where drivers can confidently plan trips knowing that fuel stations are widely available, EV owners face uncertainty about charger availability, location, and compatibility.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"padding:clamp(44px,6vw,72px) 0 0\">\n        <p style=\"margin:0 0 32px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Primary research — 36 responses<\u002Fp>\n        <div data-grid=\"trio\" style=\"border-top:var(--rule);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))\">\n          <div style=\"padding:28px 28px 28px 0;border-right:var(--hair);border-bottom:var(--hair)\"><p style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.02em\">Majority<\u002Fp><p style=\"margin:0;font-size:15px\">Struggle to find charging stations.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:28px;border-right:var(--hair);border-bottom:var(--hair)\"><p style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.02em\">Majority<\u002Fp><p style=\"margin:0;font-size:15px\">Want live availability in locators.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:28px 0 28px 28px;border-bottom:var(--hair)\"><p style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.02em\">Majority<\u002Fp><p style=\"margin:0;font-size:15px\">Find charging speed too slow.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:28px 28px 28px 0;border-right:var(--hair);border-bottom:var(--hair)\"><p style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.02em\">Moderate<\u002Fp><p style=\"margin:0;font-size:15px\">Don't know how to monitor battery health.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:28px;border-right:var(--hair);border-bottom:var(--hair)\"><p style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.02em\">Moderate<\u002Fp><p style=\"margin:0;font-size:15px\">Face unreliable battery range.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:28px 0 28px 28px;border-bottom:var(--hair);background:var(--color-surface)\"><p style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.02em;color:var(--color-accent-700)\">6.6 / 10<\u002Fp><p style=\"margin:0;font-size:15px\">Average rating of a user's overall EV experience.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Open responses<\u002Fp>\n        <ul style=\"margin:0;padding:0;list-style:none;border-top:var(--hair)\">\n          <li style=\"padding:18px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Range concerns<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Users consistently wish for better battery range and performance.<\u002Fp><\u002Fli>\n          <li style=\"padding:18px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Battery issues &amp; warranty gaps<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Frustration with battery degradation, swelling, and lack of warranty coverage.<\u002Fp><\u002Fli>\n          <li style=\"padding:18px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Service accessibility<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Lack of nearby service centers makes maintenance and support difficult.<\u002Fp><\u002Fli>\n          <li style=\"padding:18px 0;border-bottom:var(--hair)\"><p style=\"margin:0 0 4px;font-weight:600\">Charging speed<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Users want faster charging options for convenience.<\u002Fp><\u002Fli>\n          <li style=\"padding:18px 0\"><p style=\"margin:0 0 4px;font-weight:600\">Build quality &amp; reliability<\u002Fp><p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Complaints about EVs switching off at low charge or glitches in rain show need for improved durability feedback loops.<\u002Fp><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:clamp(44px,6vw,72px) 0;border-bottom:var(--hair)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Market context<\u002Fp>\n        <div data-grid=\"pair\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px\">\n          <div>\n            <p style=\"margin:0 0 12px;font-family:var(--font-heading);font-weight:800;font-size:64px;line-height:1;letter-spacing:-0.04em\">19%<\u002Fp>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-neutral-800)\">of new car sales were electric in 2025. Charging infrastructure hasn't kept pace — limited public stations, long wait times and inconsistent pricing all create barriers.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 12px;font-family:var(--font-heading);font-weight:800;font-size:64px;line-height:1;letter-spacing:-0.04em\">90% → 57%<\u002Fp>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-neutral-800)\">Combustion engines were more than 90% of new vehicle sales worldwide in 2019. By 2025 that share had fallen to 57% — tighter emissions rules, corporate phase-outs and consumer demand for cleaner alternatives.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-grid=\"rail\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);ga
